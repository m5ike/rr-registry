<!doctype html>
<html lang="cs" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RR Registry – administrace</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 5 55.4 18.5v27L32 59 8.6 45.5v-27z' fill='%23F5A524' stroke='%23F5A524' stroke-width='3' stroke-linejoin='round'/%3E%3Cpath d='M21 22l10 10-10 10M32 22l10 10-10 10' fill='none' stroke='%230E1116' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="admin.css">
  <script>try { var t = localStorage.getItem('rr.ui.theme'); t = t ? JSON.parse(t) : 'dark'; if (t === 'auto') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
  <div id="login" class="login hidden">
    <form id="loginForm" class="card login-card">
      <div class="brand big"><i data-icon="logo" data-size="44"></i><span>rr<span class="dot">.</span>registry</span></div>
      <p class="lead">Přihlášení do administrace</p>
      <label>Server <input id="lServer" placeholder="(tento server)"></label>
      <div class="tabs" id="loginTabs">
        <button type="button" data-mode="password" class="active">Jméno a heslo</button>
        <button type="button" data-mode="token">API token</button>
      </div>
      <div data-mode="password" class="form" style="grid-template-columns:1fr">
        <label>Uživatel <input id="lUser" value="admin" autocomplete="username"></label>
        <label>Heslo <input id="lPass" type="password" autocomplete="current-password"></label>
      </div>
      <div data-mode="token" class="hidden">
        <label>API token <input id="lToken" placeholder="RR_API_TOKEN nebo uživatelský token" autocomplete="off"></label>
      </div>
      <button class="btn primary" type="submit" style="height:46px">Přihlásit</button>
      <a id="portalLogin" class="btn hidden" href="/_portal/auth/login?next=/admin/" style="height:46px;justify-content:center">Přihlásit účtem portálu</a>
      <p id="loginErr" class="error" role="alert"></p>
      <a href="/" class="small">← úvodní stránka</a>
    </form>
  </div>

  <div id="app" class="hidden">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/dashboard"><i data-icon="logo" data-size="32"></i><span>rr<span class="dot">.</span>registry</span></a>
      <nav id="nav" aria-label="Hlavní navigace">
        <div class="nav-group"><span>Registr</span>
          <a href="#/dashboard" data-view="dashboard"><i data-icon="grid"></i>Přehled</a>
          <a href="#/repos" data-view="repos"><i data-icon="repo"></i>Repozitáře</a>
          <a href="#/packages" data-view="packages"><i data-icon="package"></i>Balíčky</a>
          <a href="#/files" data-view="files"><i data-icon="folder"></i>Soubory</a>
          <a href="#/images" data-view="images"><i data-icon="image"></i>Docker image</a>
          <a href="#/git" data-view="git"><i data-icon="git"></i>Git</a>
          <a href="#/search" data-view="search"><i data-icon="search"></i>Hledání</a>
        </div>
        <div class="nav-group"><span>Provoz</span>
          <a href="#/routes" data-view="routes"><i data-icon="route"></i>Směrování</a>
          <a href="#/cache" data-view="cache"><i data-icon="cache"></i>Cache</a>
          <a href="#/webhooks" data-view="webhooks"><i data-icon="bell"></i>Webhooky</a>
          <a href="#/jobs" data-view="jobs"><i data-icon="clock"></i>Úlohy</a>
          <a href="#/logs" data-view="logs"><i data-icon="terminal"></i>Logy</a>
        </div>
        <div class="nav-group"><span>Správa</span>
          <a href="#/users" data-view="users"><i data-icon="users"></i>Uživatelé</a>
          <a href="#/tokens" data-view="tokens"><i data-icon="key"></i>Tokeny</a>
          <a href="#/settings" data-view="settings"><i data-icon="gear"></i>Nastavení</a>
          <a href="#/clients" data-view="clients"><i data-icon="download"></i>Klienti</a>
        </div>
      </nav>
      <div class="sidebar-foot">
        <div class="me"><span class="avatar" id="avatar">?</span><div class="me-text"><b id="who"></b><span class="muted small" id="whoRole"></span></div></div>
        <div class="row"><button id="themeBtn" type="button" class="btn small ghost"><i data-icon="moon" data-size="15"></i><span>Motiv</span></button><span class="spacer"></span><button id="logout" type="button" class="btn small ghost"><i data-icon="logout" data-size="15"></i>Odhlásit</button></div>
      </div>
    </aside>
    <main>
      <header class="topbar">
        <button id="menuToggle" type="button" class="icon-btn only-mobile" aria-label="Menu"><i data-icon="menu"></i></button>
        <div class="title-block"><span class="crumb" id="serverInfo"></span><h1 id="title">Přehled</h1></div>
        <button id="cmdBtn" type="button" class="cmd"><i data-icon="search"></i><span>Hledat nebo spustit příkaz…</span><kbd>⌘K</kbd></button>
        <button id="liveLogBtn" type="button" class="icon-btn" aria-label="Živý log v okně" title="Živý log v okně"><i data-icon="terminal"></i></button>
        <button id="newBtn" type="button" class="btn primary" style="height:42px"><i data-icon="plus"></i><span>Nový repozitář</span></button>
      </header>
      <section id="view"></section>
    </main>
  </div>

  <div id="wm" aria-live="polite"></div>
  <nav id="dock" class="hidden" aria-label="Otevřená okna"></nav>
  <div id="modal" class="modal hidden"><div class="modal-box card" role="dialog" aria-modal="true"><header class="win-bar"><i data-icon="window" data-size="16"></i><span class="win-title" id="modalTitle"></span><button type="button" class="win-btn close" data-close aria-label="Zavřít"><i data-icon="x" data-size="15"></i></button></header><div id="modalBody"></div></div></div>
  <div id="toast" class="toast hidden" role="status"></div>

  <script src="config.js"></script>
  <script src="rr-client.js"></script>
  <script src="ui.js"></script>
  <script src="admin.js"></script>
</body>
</html>
